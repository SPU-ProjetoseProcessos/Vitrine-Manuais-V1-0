<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Vitrine de Manuais da CentralGov: um manual para cada perfil.">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>Vitrine de Manuais CentralGov</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lexend:wght@500;600;700&family=Source+Sans+3:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Layout: identidade da Ficha de Entrada · barra branca (logo | SPU + Abrir a CentralGov) · faixa azul · hero branco · faixa cinza com 3 grupos de cartões */
:root{
  --bg:#FFFFFF; --band:#F5F5F7; --surface:#FFFFFF; --soft:#EDF3FC;
  --ink:#0C326F; --text:#333333; --muted:#636363; --rule:#E5E5EA; --rule-2:#D2D2D7;
  --azul:#1351B4; --azul-esc:#0C326F; --mark:#FFCD07; --ok:#168821; --warn:#9A6200; --nav:#0C326F;
  --f-ui:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0E1726; --band:#0A111D; --surface:#132036; --soft:#18304F;
  --ink:#C5D4EB; --text:#E2E8F0; --muted:#9AA8BC; --rule:#22324A; --rule-2:#344862;
  --azul:#5992ED; --azul-esc:#C5D4EB; --mark:#FFD84A; --ok:#6CCB75; --warn:#F0C25C; --nav:#0A2550; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1726; --band:#0A111D; --surface:#132036; --soft:#18304F;
  --ink:#C5D4EB; --text:#E2E8F0; --muted:#9AA8BC; --rule:#22324A; --rule-2:#344862;
  --azul:#5992ED; --azul-esc:#C5D4EB; --mark:#FFD84A; --ok:#6CCB75; --warn:#F0C25C; --nav:#0A2550; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--text);font-family:var(--f-ui);font-size:1rem;line-height:1.5;letter-spacing:-.005em;-webkit-font-smoothing:antialiased}
h1,h2,h3{margin:0;color:var(--ink);letter-spacing:-.02em;text-wrap:balance}
:focus-visible{outline:3px solid var(--mark);outline-offset:2px}
.wrap{max-width:1120px;margin-inline:auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* barra */
.barra{background:var(--surface);box-shadow:0 1px 6px rgba(0,0,0,.06);position:sticky;top:env(safe-area-inset-top,0px);z-index:30}
.barra-in{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:12px}
.marca{display:flex;align-items:center;gap:14px;min-width:0}
.logo{background:#fff;padding:2px 6px;border-radius:6px;display:flex}
.logo img{height:42px;width:auto;display:block}
.sep{width:1.5px;height:40px;background:var(--rule-2);flex:none}
.spu{display:flex;flex-direction:column;line-height:1.15;min-width:0}
.spu b{color:var(--azul-esc);font-weight:800;font-size:1.45rem;letter-spacing:.02em}
.spu small{color:var(--text);font-size:.8rem;font-weight:600;white-space:nowrap}
.cg{display:inline-flex;align-items:center;gap:8px;border-radius:999px;padding:11px 26px;font-weight:700;font-size:1.02rem;text-decoration:none;background:var(--mark);color:#3A2C00;box-shadow:0 6px 16px -6px rgba(0,0,0,.35);white-space:nowrap}
.cg:hover{background:#FFD84A}
.cg svg{width:19px;height:19px;flex:none}
.cg .breve{font-style:normal;font-size:.7rem;font-weight:700;background:rgba(58,44,0,.12);border-radius:999px;padding:1px 8px}
.nav{background:var(--nav)}
.abas{display:flex;gap:4px;padding-block:8px;align-items:center}
.aba{padding:8px 14px;border-radius:999px;font-weight:700;font-size:.9rem;color:#fff;text-decoration:none;white-space:nowrap}
.aba[aria-current="page"]{background:#fff;color:#0C326F;box-shadow:0 4px 12px -4px rgba(0,0,0,.4)}
.aba.dim{font-weight:600;color:#C9D7EE;margin-left:auto}

/* hero */
.hero{padding-block:40px 36px}
.hero h1{font-size:clamp(1.9rem, 1.4rem + 2vw, 2.7rem);line-height:1.12;font-weight:700;margin:0 0 14px}
.hero p{margin:0;font-size:1.05rem;max-width:60ch}
.hero p b{color:var(--ink)}

.srv{margin-top:22px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.srv-bt{display:inline-flex;align-items:center;gap:8px;border-radius:999px;padding:10px 22px;font-weight:700;font-size:.98rem;text-decoration:none;border:1.5px solid var(--azul);color:var(--azul);background:var(--surface)}
.srv-bt:hover{background:var(--soft)}
.srv-bt svg{width:18px;height:18px;flex:none}
.srv-bt.off{border-style:dashed;border-color:var(--rule-2);color:var(--muted)}
.srv small{color:var(--muted);font-size:.86rem}
/* faixa cinza */
.faixa{background:var(--band);border-top:1px solid var(--rule);padding-block:32px 44px}
.grupos{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,2fr) minmax(0,1fr);gap:28px;align-items:stretch}
.gr{display:flex;flex-direction:column;min-width:0}
.gr .cards{flex:1}
.gr h2{font-size:1.2rem;font-weight:700;display:flex;align-items:center;gap:10px}
.gr h2::before{content:"";width:10px;height:10px;border-radius:50%;background:var(--gc)}
.gr>p{margin:2px 0 14px;color:var(--muted);font-size:.92rem}
.cards{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);gap:24px}
.card{position:relative;background:var(--surface);border:1px solid var(--rule);border-radius:12px;padding:18px;display:flex;flex-direction:column;gap:8px;min-width:0;text-decoration:none;color:inherit;transition:border-color .15s,box-shadow .15s,transform .15s}
.card:hover{border-color:var(--c);box-shadow:0 10px 24px -16px rgba(12,50,111,.5);transform:translateY(-2px)}
.cards .card:not(:last-child)::after{content:"→";position:absolute;right:-19px;top:22px;color:var(--rule-2);font-weight:700}
.top{display:flex;align-items:center;gap:10px}
.n{width:28px;height:28px;border-radius:50%;background:var(--c);color:#fff;display:grid;place-items:center;font-weight:800;font-size:.88rem;flex:none}
.card b{color:var(--ink);font-size:1.02rem;line-height:1.25}
.card p{margin:0;color:var(--muted);font-size:.92rem;line-height:1.45}
.tag{align-self:flex-start;font-size:.76rem;font-weight:700;color:var(--c);background:color-mix(in srgb,var(--c) 10%,var(--surface));border-radius:999px;padding:2px 10px}
.chip{align-self:flex-start;font-family:var(--f-mono);font-size:.68rem;color:#3A2C00;background:var(--mark);border-radius:6px;padding:1px 7px}
.pe{margin-top:auto;padding-top:10px;border-top:1px solid var(--rule);display:flex;flex-direction:column;align-items:flex-start;gap:6px}
.st{font-size:.8rem;font-weight:700;display:inline-flex;align-items:center;gap:5px}
.st.ok{color:var(--ok)} .st.wip{color:var(--warn)}
.st svg{width:13px;height:13px}
.abrir{font-size:.9rem;font-weight:700;color:var(--azul);text-decoration:underline;text-underline-offset:3px}

footer{border-top:1px solid var(--rule);padding-block:18px 26px;background:var(--bg)}
footer p{margin:0;color:var(--muted);font-size:.9rem}
footer b{color:var(--azul);font-family:var(--f-mono);font-weight:500}
.versao{margin-left:8px;display:inline-block;font-size:.78rem;font-weight:600;border:1px solid var(--rule-2);border-radius:999px;padding:1px 10px}

@media (max-width:1000px){.grupos{grid-template-columns:minmax(0,1fr)}.cards{grid-auto-flow:row;grid-template-columns:repeat(2,minmax(0,1fr))}.gr:last-child .cards{grid-template-columns:minmax(0,1fr)}}
@media (max-width:560px){.cards{grid-template-columns:minmax(0,1fr)!important;gap:12px}.cards .card::after{display:none}.cg .t{display:none}.cg{padding:9px 12px}.logo img{height:30px}.spu small{display:none}.spu b{font-size:1.15rem}.marca{gap:8px}.sep{height:30px}.aba.dim{display:none}}
@media (prefers-reduced-motion:reduce){.card{transition:none}}

.lk-grupos{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:32px}
.lk-list{display:grid;gap:12px}
.lk{display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:14px;background:var(--surface);border:1px solid var(--rule);border-radius:12px;padding:14px 16px;text-decoration:none;color:inherit;transition:border-color .15s,box-shadow .15s,transform .15s}
a.lk:hover{border-color:var(--c);box-shadow:0 10px 24px -16px rgba(12,50,111,.5);transform:translateY(-1px)}
.lk .ico{width:42px;height:42px;border-radius:10px;background:var(--c);display:grid;place-items:center;flex:none}
.lk .ico svg{width:22px;height:22px;fill:none;stroke:#fff;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.lk b{display:block;color:var(--ink);font-size:1rem;line-height:1.25}
.lk small{display:block;color:var(--muted);font-size:.88rem;line-height:1.35}
.lk code{display:block;margin-top:3px;font-family:var(--f-mono);font-size:.74rem;color:var(--azul);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lk .go{font-size:.88rem;font-weight:700;color:var(--azul);white-space:nowrap}
.lk.off{border-style:dashed;background:transparent}
.lk.off .ico{opacity:.55}
.lk.off .go{color:var(--muted);font-weight:600;font-size:.8rem}
.hom{display:inline-block;margin-left:6px;vertical-align:1px;font-size:.66rem;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:#7A4E00;background:#FFE3A3;border-radius:999px;padding:1px 7px}
.pub{display:inline-block;margin-left:6px;vertical-align:1px;font-size:.66rem;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:#0B5E1A;background:#D4F0D9;border-radius:999px;padding:1px 7px}
.pub.int{color:#0C326F;background:#DBE8FB}
#escritorio{grid-column:1/-1}
#escritorio .lk-list{grid-template-columns:repeat(2,minmax(0,1fr))}
@media (max-width:860px){#escritorio .lk-list{grid-template-columns:minmax(0,1fr)}}
.atalhos{display:flex;gap:10px;flex-wrap:wrap;margin-top:22px}
.atalhos a{display:inline-flex;align-items:center;gap:6px;padding:7px 14px;border-radius:999px;border:1.5px solid var(--azul);color:var(--azul);font-weight:700;font-size:.9rem;text-decoration:none;background:var(--surface)}
.atalhos a:hover{background:var(--soft)}
.atalhos a em{font-style:normal;background:var(--soft);color:var(--azul);border-radius:999px;padding:0 7px;font-size:.78rem}
.gr{scroll-margin-top:140px}
@media (max-width:860px){.lk-grupos{grid-template-columns:minmax(0,1fr)}}
@media (max-width:480px){.lk{grid-template-columns:auto minmax(0,1fr)}.lk .go{grid-column:2}}


.sec{padding-block:34px 10px}
.sec-h{display:flex;align-items:baseline;gap:12px;margin-bottom:16px;flex-wrap:wrap}
.sec-h .n{font-family:var(--f-mono);font-size:.8rem;color:var(--azul)}
.sec-h h2{font-size:1.35rem}
.sec-h p{margin:0;color:var(--muted);font-size:.92rem;flex-basis:100%}
.hero2{background:linear-gradient(135deg,#0C326F,#1351B4);color:#fff;padding-block:40px 36px}
.hero2 .eb{font-size:.78rem;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:#FFCD07}
.hero2 h1{color:#fff;font-size:clamp(2rem,1.4rem+2vw,2.8rem);margin:6px 0 10px}
.hero2 p{margin:0;max-width:70ch;color:#DCE6F6;font-size:1.06rem}
.pilares{display:flex;gap:8px;flex-wrap:wrap;margin-top:18px}
.pilares span{border:1px solid rgba(255,255,255,.35);border-radius:999px;padding:5px 14px;font-weight:600;font-size:.88rem}
.kpis{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:14px}
.kpi{font:inherit;text-align:left;cursor:pointer;background:var(--surface);border:1px solid var(--rule);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:2px;border-top:4px solid var(--k)}
.kpi:hover{box-shadow:0 12px 24px -18px var(--k);border-color:var(--k)}
.kpi b{font-size:2.1rem;line-height:1;color:var(--ink);font-variant-numeric:tabular-nums}
.kpi span{font-weight:700;color:var(--ink);font-size:.95rem}
.kpi small{color:var(--muted);font-size:.8rem}
.charts{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.3fr);gap:18px}
.box{background:var(--surface);border:1px solid var(--rule);border-radius:14px;padding:18px}
.box h3{font-size:1rem;margin-bottom:12px}
.donut{display:flex;align-items:center;gap:22px}
.leg{display:grid;gap:8px;font-size:.9rem}
.leg i{display:inline-block;width:11px;height:11px;border-radius:3px;margin-right:8px;vertical-align:-1px}
.leg b{font-variant-numeric:tabular-nums}
.bars{display:grid;gap:10px}
.bar{display:grid;grid-template-columns:130px minmax(0,1fr) 30px;align-items:center;gap:10px;font-size:.88rem}
.bar .t{height:16px;border-radius:4px;background:var(--soft);overflow:hidden}
.bar .t i{display:block;height:100%;background:var(--c);border-radius:4px}
.bar b{text-align:right;font-variant-numeric:tabular-nums}
.grid4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.tile{background:var(--surface);border:1px solid var(--rule);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:6px}
.tile .top{display:flex;align-items:center;gap:10px}
.tile .q{width:36px;height:36px;border-radius:9px;background:var(--c);display:grid;place-items:center;color:#fff;font-weight:800;font-size:.8rem;flex:none}
.tile b{color:var(--ink);font-size:.95rem;line-height:1.25}
.tile small{color:var(--muted);font-size:.82rem}
.tile .pe{margin-top:auto;display:flex;justify-content:space-between;align-items:center;padding-top:8px;border-top:1px solid var(--rule);font-size:.8rem}
.tile .pe a,.tile .pe span.l{font-weight:700;color:var(--azul);text-decoration:none}
.tile .pe span.l.off{color:var(--muted);font-weight:600}
.tile .pe{flex-direction:row!important}
.sit{font-size:.7rem;font-weight:700;border-radius:999px;padding:2px 8px}
.sit.op{background:#E3F4E6;color:#168821}.sit.dev{background:#FFF1D6;color:#9A6200}.sit.pub{background:#DBE8FB;color:#1351B4}.sit.na{background:#EEE;color:#777}
.fr2{background:var(--surface);border:1px solid var(--rule);border-radius:12px;padding:16px;border-left:5px solid var(--c)}
.fr2 b{color:var(--ink)} .fr2 p{margin:4px 0 8px;color:var(--muted);font-size:.86rem}
.fr2 .ent{font-size:.8rem;color:var(--text)}
.rot{display:grid;grid-template-columns:minmax(0,1.6fr) 1fr 1fr;gap:0;background:var(--surface);border:1px solid var(--rule);border-radius:12px;overflow:hidden;font-size:.88rem}
.rot div{padding:10px 14px;border-bottom:1px solid var(--rule)}
.rot .h{background:#0C326F;color:#fff;font-weight:700;font-size:.8rem;letter-spacing:.04em;text-transform:uppercase}
.preencher{color:#9A6200;font-style:italic}
.gov{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.nota{margin-top:10px;font-size:.82rem;color:var(--muted)}
.kpis,.charts,.grid4,.grid3,.gov{}
@media (max-width:1000px){.kpis{grid-template-columns:repeat(3,minmax(0,1fr))}.grid4{grid-template-columns:repeat(2,minmax(0,1fr))}.grid3,.gov{grid-template-columns:minmax(0,1fr)}.charts{grid-template-columns:minmax(0,1fr)}}
@media (max-width:560px){.kpis,.grid4{grid-template-columns:minmax(0,1fr)}.donut{flex-direction:column}.bar{grid-template-columns:90px minmax(0,1fr) 26px}.rot{font-size:.8rem}.rot div{padding:8px}}
.marca-ex{display:inline-block;font-size:.66rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;background:#FFE3A3;color:#7A4E00;border-radius:999px;padding:1px 8px;margin-left:8px;vertical-align:3px}

.hero .eb{display:block;font-size:.78rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--azul);margin-bottom:6px}
.hero h1 span{color:var(--muted);font-weight:500}
.frentes{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:22px}
.fr{background:var(--surface);border:1px solid var(--rule);border-radius:16px;padding:22px 20px 18px;display:flex;flex-direction:column;gap:10px;min-width:0;position:relative;overflow:hidden;transition:box-shadow .15s,border-color .15s}
.fr::before{content:"";position:absolute;inset:0 0 auto 0;height:5px;background:var(--fc)}
.fr.on{border-color:var(--fc);box-shadow:0 18px 34px -24px var(--fc)}
.fr-n{font-family:var(--f-mono);font-size:.82rem;font-weight:500;color:var(--fc)}
.fr h2{font-size:1.25rem;font-weight:700;line-height:1.2}
.fr>p{margin:0;color:var(--muted);font-size:.92rem}
.fr ul{list-style:none;margin:6px 0 0;padding:12px 0 0;border-top:1px solid var(--rule);display:grid;gap:9px}
.fr li{display:grid;grid-template-columns:auto minmax(0,1fr);gap:10px;align-items:start}
.fr li i{width:8px;height:8px;border-radius:50%;background:var(--fc);margin-top:.5em}
.fr li b{display:block;color:var(--ink);font-size:.95rem;line-height:1.3}
.fr li small{display:block;color:var(--muted);font-size:.84rem;line-height:1.35}
.fr .acc{margin-top:auto;padding-top:14px}
.fr .acc button{width:100%;border:0;border-radius:999px;padding:11px 16px;font:inherit;font-weight:700;font-size:.92rem;cursor:pointer;background:var(--fc);color:#fff;display:flex;justify-content:center;align-items:center;gap:8px}
.fr .acc button:hover{filter:brightness(1.08)}
.fr.on .acc button{background:var(--mark);color:#3A2C00}
.painel{margin-top:28px;background:var(--surface);border:1px solid var(--rule);border-top:5px solid var(--pc);border-radius:16px;padding:22px}
.painel-h{display:flex;align-items:baseline;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:16px}
.painel-h h2{font-size:1.2rem}
.painel-h span{color:var(--muted);font-size:.88rem}
.blocos{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px 26px}
.abas{overflow-x:auto;scrollbar-width:none}.abas::-webkit-scrollbar{display:none}
.bl h3{font-size:.95rem;margin-bottom:8px;display:flex;align-items:center;gap:8px}
.bl h3::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--pc)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip-l{display:inline-flex;align-items:center;gap:6px;border:1.5px solid color-mix(in srgb,var(--pc) 40%,var(--rule));background:color-mix(in srgb,var(--pc) 6%,var(--surface));color:var(--ink);text-decoration:none;font-weight:600;font-size:.86rem;border-radius:999px;padding:6px 12px}
a.chip-l:hover{border-color:var(--pc);background:color-mix(in srgb,var(--pc) 12%,var(--surface))}
a.chip-l::after{content:"↗";color:var(--pc);font-weight:700}
.chip-l.off{border-style:dashed;color:var(--muted);background:transparent}
.chip-l.off em{font-style:normal;font-size:.72rem}
@media (max-width:980px){.frentes{grid-template-columns:minmax(0,1fr)}.blocos{grid-template-columns:minmax(0,1fr)}}


#tab-vitrine{--ground:#EEF2F7;--ink-2:#3B4B60;--gov:#1351B4;--wip:#9A5B00;--master:#8E1B3A;--ok:#168821;--title:#0C326F;--f-display:"Lexend",system-ui,sans-serif;--f-body:"Source Sans 3",system-ui,sans-serif;background:var(--ground);font-family:var(--f-body);font-size:1.02rem}
#tab-vitrine .in{max-width:1100px;margin-inline:auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:clamp(22px, 14px + 2vw, 40px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) #tab-vitrine{--ground:#0B1320;--ink-2:#BCC8D8;--gov:#8AB4FF;--wip:#F0AE5C;--master:#E07A95;--ok:#6CCB75;--title:#E8EEF6}}
:root[data-theme="dark"] #tab-vitrine{--ground:#0B1320;--ink-2:#BCC8D8;--gov:#8AB4FF;--wip:#F0AE5C;--master:#E07A95;--ok:#6CCB75;--title:#E8EEF6}
.tab[hidden]{display:none!important}
.aba{cursor:pointer;border:0;background:transparent;font:inherit;font-weight:700;font-size:.9rem}
